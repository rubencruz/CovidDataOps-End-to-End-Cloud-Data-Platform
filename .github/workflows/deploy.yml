name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release tag"
        required: true
        default: "phase-7"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - name: Build and push container image
        run: |
          gcloud builds submit \
            --tag "${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/covid-data/covid-pipeline:${{ inputs.image_tag }}" \
            .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT }}" \
            -var="location=${{ vars.REGION }}" \
            -var="container_image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/covid-data/covid-pipeline:${{ inputs.image_tag }}" \
            -var="app_version=${{ inputs.image_tag }}" \
            -var="notification_email=${{ vars.NOTIFICATION_EMAIL }}"